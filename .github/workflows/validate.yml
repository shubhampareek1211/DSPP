name: Validate research repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile active Python scripts
        run: python -m py_compile scripts/01_build/*.py scripts/02_analysis/*.py scripts/03_figures/*.py scripts/04_release/*.py

      - name: Regenerate final figures
        run: |
          python scripts/03_figures/make_paper_figures_v3.py
          python scripts/03_figures/make_figure3_1_pmmvy_intensity.py

      - name: Verify generated outputs
        run: |
          test -s results/figures/paper/fig1_autonomy_tercile.png
          test -s results/figures/paper/fig2_banking_bonus.png
          test -s results/figures/paper/fig3_branches_vs_growth.png
          test -s results/figures/paper/fig4_panel_banking_v3.png
          test -s results/figures/paper/figure3_1_pmmvy_intensity.png
          test -s output/pdf/cash_transfers_banking_womens_financial_empowerment_india.pdf

      - name: Check optional PhonePe builder interface
        run: python scripts/01_build/build_phonepe_pulse_panel.py --help
